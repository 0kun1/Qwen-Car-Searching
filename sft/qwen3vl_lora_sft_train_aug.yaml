### model
model_name_or_path: /root/autodl-tmp/car_search/pretrained/Qwen/Qwen3-VL-2B-Instruct
image_max_pixels: 786432
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### dataset
dataset_dir: data
dataset: train_parking_aug_correct
template: qwen3_vl_nothink
cutoff_len: 4096
preprocessing_num_workers: 8
dataloader_num_workers: 4

### output
output_dir: saves/qwen3-vl-sft-lora-aug-4090
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb
run_name: qwen3vl-parking-sft-aug-4090

### train
per_device_train_batch_size: 3
gradient_accumulation_steps: 3
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
fp16: false
gradient_checkpointing: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### vlm
freeze_vision_tower: false
freeze_multi_modal_projector: true